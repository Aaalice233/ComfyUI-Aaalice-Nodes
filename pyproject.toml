[project]
name = "comfyui-aaalice-nodes"
version = "0.14.7"
description = "Compact parameter controls and workflow utilities for ComfyUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Aaalice233" }]
# 仅列 ComfyUI 未自带的依赖；与 requirements.txt 保持同步
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Aaalice233/ComfyUI-Aaalice-Nodes"
Homepage = "https://github.com/Aaalice233/ComfyUI-Aaalice-Nodes"
Documentation = "https://github.com/Aaalice233/ComfyUI-Aaalice-Nodes#readme"
"Bug Tracker" = "https://github.com/Aaalice233/ComfyUI-Aaalice-Nodes/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nodes", "nodes.tools", "nodes.control", "nodes.prompt", "nodes.gallery", "nodes.krita", "nodes._lib"]

[tool.setuptools.package-data]
"*" = ["js/**/*", "locales/**/*"]
"nodes.krita" = ["bridge_bundle/**/*"]

# Comfy Registry / Manager 发布元数据
# PublisherId 须与 https://registry.comfy.org 上创建的发布者 ID 完全一致（创建后不可改）
[tool.comfy]
PublisherId = "aaalice"
DisplayName = "ComfyUI-Aaalice-Nodes"
Icon = "https://raw.githubusercontent.com/Aaalice233/ComfyUI-Aaalice-Nodes/main/assets/icon.png"
Banner = "https://raw.githubusercontent.com/Aaalice233/ComfyUI-Aaalice-Nodes/main/assets/banner.png"
